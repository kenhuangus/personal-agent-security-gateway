<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Gateway Console — Sign in</title>
<style>body{font-family:system-ui,sans-serif;max-width:420px;margin:6rem auto;padding:1rem}input{width:100%;padding:0.5rem;margin:0.25rem 0 1rem;box-sizing:border-box}.error{background:#fee2e2;border:1px solid #dc2626;border-radius:6px;padding:0.75rem;margin-bottom:1rem}button{background:#111827;color:#fff;border:none;padding:0.6rem 1.2rem;border-radius:4px;cursor:pointer}</style>
</head>
<body>
<h1>Gateway Console</h1>
<p>Admin sign-in (password + authenticator code).</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Password<br><input type="password" name="password" autocomplete="current-password" required></label>
  <label>Authenticator code<br><input type="text" name="totp_code" inputmode="numeric" autocomplete="one-time-code" required></label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
