# CI — Personal Agent Security Gateway
#
# Gates (all must pass):
#   1. Pinned OPA binary checksum (third_party/opa/opa v1.8.0)
#   2. OPA gates: opa fmt --fail, opa check, opa test (70 tests)
#   3. SDK floor (FR-005/AC-10, GHSA-qx49-fqc8-xw99): mcp >= 1.30.0/2.2.0
#   4. CVE scan (AC-10): pip-audit blocks on any HIGH/CRITICAL CVE
#   5. Full pytest suite (lint + typecheck via ruff/mypy where configured)
#   6. AC-11 load test: 10 concurrent sessions, local p95 > 100 ms fails
#
# File only — no GitHub ops from agents (build rules).

name: ci

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned OPA binary
        run: bash scripts/verify_opa.sh

      - name: OPA gates (fmt / check / test)
        run: |
          chmod +x third_party/opa/opa
          third_party/opa/opa fmt --fail src/gateway/policies/v1
          third_party/opa/opa check src/gateway/policies/v1
          third_party/opa/opa test src/gateway/policies/v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[test]"
          .venv/bin/pip install pip-audit

      - name: SDK-floor assertion (FR-005/AC-10, GHSA-qx49-fqc8-xw99)
        run: .venv/bin/python scripts/check_sdk_floor.py

      - name: CVE scan (AC-10, blocks HIGH+)
        run: .venv/bin/python scripts/check_cve.py

      - name: Full test suite
        run: .venv/bin/python -m pytest tests/ -q

      - name: AC-11 load test (10 concurrent sessions, p95 <= 100 ms)
        run: .venv/bin/python scripts/ac11_load.py --sessions 10 --iters 50 --warmup 10
